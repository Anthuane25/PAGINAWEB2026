<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Hugo Winston Theme</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .contenedor {
            height: 100vh;
            width: 100vw;
            background-color: rgb(233, 238, 238);
            border: 1.5rem solid #7b16ff;
            box-sizing: border-box;
            margin: 0 auto;
        }

        header {
            padding-top: 20px;
            padding-bottom: 50px;
            margin-left: 20px;
        }

        ul{
            text-align: end;
        }

        li {
            display: inline-block;
            padding: 5px;
            margin-top: 5px;
            margin-bottom: 5px;
            margin-right: 10px;
        }

        li a{
            color:#7b16ff;
            text-decoration: none;
        }

        .imagen {
            width: 8vh;
            height: 8vh;
            border: 1px solid black;
            border-radius: 4vh;
        }
        .contenedor a{
            text-decoration: none;
        }

        .subtitulo{
            
        }





    </style>

</head>

<body>
    <div class="contenedor">
        <header>
            <div class="cabecera">
                <a href="">HUGO WINSTON THEME</a>
                <ul>
                    <li><a href="">Home</a></li>
                    <li><a href="">Blog</a></li>
                    <li><a href="">About</a></li>
                    <li><a href="">Tags</a></li>
                </ul>
            </div>

            <img class="imagen" src="../imagenes/Hugo.png" alt="">
            <p class="subtitulo">Winston Smith Writer & Futurist </p>


        </header>


    </div>

</body>

</html>
