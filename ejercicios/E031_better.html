<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Better now</title>

    <style>
        .contenedor {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 15px;
            width: 70%;
            height: 700px;
            margin: 0 auto;
            background-color: rgba(0, 0, 0, 0.856);
            padding: 20px;
            border-radius: 5px;
        }

        .contenedor div {
            color: aliceblue;

            min-height: 220px;
            background-size: cover;
            background-position: center;

             border-radius: 10px;
        }

        .uno {
            background-image: url(../imagenes/dribble_1.png);
            grid-area: 1/1/1/3;
        }

        .dos {
            background-image: url(../imagenes/dribble_2.png);
        }

        .tres {
            background-image: url(../imagenes/dribble_3.png);
            grid-area: 2/1/3/2;
        }

        .cuatro {
            background-image: url(../imagenes/dribble_4.png);
        }

        .cinco {
            background-image: url(../imagenes/dribble_5.png);
            grid-area: 2/3/4/3;
        }

        .seis {
            background-image: url(../imagenes/dribble_6.png);
        }

        .siete {
            background-image: url(../imagenes/dribble_7.png);
        }
    </style>


</head>

<body>
    <div class="contenedor">
        <div class="uno"></div>
        <div class="dos"></div>
        <div class="tres"></div>
        <div class="cuatro"></div>
        <div class="cinco"></div>
        <div class="seis"></div>
        <div class="siete"></div>
    </div>

</body>

</html>
