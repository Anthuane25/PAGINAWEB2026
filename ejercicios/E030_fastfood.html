<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Food</title>

    <style>
       
        .contenedor{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            width: 60%;
            height: 800px;
            margin: 0 auto;
            background-color: black;
            padding: 20px;
            border-radius: 5px;
            
        }

        .contenedor div{
            min-height: 100px;
            background-size: cover;
            background-position: center;

            
            border-radius: 10px;

        }

        .uno{
            background-image: url(../imagenes/1.png);
        }

        .dos{
            background-image: url(../imagenes/2.png);
        }

        .tres{
            background-image: url(../imagenes/3.png);
            grid-area: 1/3/1/5;
        }

        .cuatro{
            background-image: url(../imagenes/4.png);
            grid-area: 2/1/4/2;
        }

        .cinco{
            background-image: url(../imagenes/5.png);
            grid-area: 2/2/3/4;
        }

        .seis{
            background-image: url(../imagenes/6.png);
        }

        .siete{
            background-image: url(../imagenes/7.png);
            grid-area: 3/2/4/4;
        }

        .ocho{
            background-image: url(../imagenes/8.png);
        }



    </style>


</head>

<body>
    <div class="contenedor">
        <div class="uno"></div>
        <div class="dos"></div>
        <div class="tres"></div>
        <div class="cuatro"></div>
        <div class="cinco"></div>
        <div class="seis"></div>
        <div class="siete"></div>
        <div class="ocho"></div>
    </div>


    
</body>
</html>
