<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario del Viajero</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        .semana {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            margin-top: 20px;
            margin-bottom: 5px;
            color: white;
        }

        .semana div {
            padding: 5px 0;
        }

        .dia {
            display: flex;
            align-items: center;
            justify-content: center;
            /*border: 1px solid rgb(56, 53, 53);*/
            border: 1px solid white;
            font-size: 2rem;
        }

        .dia:hover {
            background-color: rgba(207, 216, 216, 0.363);
        }


        .mes {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: 80px;
            gap: 6px;
            color: white;
        }

        .domingo {
            /*background-color: rgba(243, 205, 198, 0.452);*/
            background-color: rgba(248, 171, 158, 0.514);
        }

        .contenedor {
            background-image: url(https://picsum.photos/id/237/536/354.jpg?);
            padding: 20px;
            width: 800px;
            border: 6px double rgba(0, 0, 0, 0.5);
            margin: 0 auto;
            background-color: rgba(250, 235, 215, 0.678);
        }

        header {
            text-align: center;
            padding: 1.5rem;
            border-bottom: 2px solid rgba(0, 0, 0, 0.562);
        }


        header p {
            font-style: italic;
            font-size: 0.8rem;
            color: gray;
        }


        h1 {
            font-size: 2.5rem;
            padding-bottom: 0.2rem;
            /*color: rgba(0, 0, 0, 0.726);*/
            color: white;
        }

        footer {
            text-align: center;
            font-size: 12px;
            /*color: gray;*/
            margin: 10px;
            color: white;
        }

        .pantalla{
            background-color: rgba(48, 49, 49, 0.432);
        }



    </style>


</head>

<body>
    <div class="contenedor">
        <div class="pantalla">
            <header>
                <h1>Octubre 1897</h1>
                <p>Registro de observaciones del viajero</p>
            </header>
            <hr>

            <div class="semana">
                <div>Lun</div>
                <div>Mar</div>
                <div>Mié</div>
                <div>Jue</div>
                <div>Vie</div>
                <div>Sáb</div>
                <div>Dom</div>
            </div>

            <hr>
            <br>

            <div class="mes">
                <div></div>
                <div class="dia">1</div>
                <div class="dia">2</div>
                <div class="dia">3</div>
                <div class="dia">4</div>
                <div class="dia">5</div>
                <div class="dia domingo">6</div>

                <div class="dia">7</div>
                <div class="dia">8</div>
                <div class="dia">9</div>
                <div class="dia">10</div>
                <div class="dia">11</div>
                <div class="dia">12</div>
                <div class="dia domingo">13</div>

                <div class="dia">14</div>
                <div class="dia">15</div>
                <div class="dia">16</div>
                <div class="dia">17</div>
                <div class="dia">18</div>
                <div class="dia">19</div>
                <div class="dia domingo">20</div>

                <div class="dia">21</div>
                <div class="dia">22</div>
                <div class="dia">23</div>
                <div class="dia">24</div>
                <div class="dia">25</div>
                <div class="dia">26</div>
                <div class="dia domingo">27</div>

                <div class="dia">28</div>
                <div class="dia">29</div>
                <div class="dia">30</div>
                <div class="dia">31</div>
            </div>

            <br>

            <hr>

            <footer>
                <p>
                    "El tiempo se escribe a mano en los márgenes del mundo"
                </p>
            </footer>

        </div>
    </div>


</body>

</html>
