<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAGEN DE FONDO DE UN DIV</title>    
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .dimensiones{
            height: 100vh;
            width: 100vw;
        }

        .imagen{
            background-image: url("https://picsum.photos/1920/1000");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;

            overflow: hidden;

        }

        h1{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 5rem;
            color: white;
            margin-top: 40vh;
            text-align: center;
            background-color: rgb(92, 92, 89);
        }



    </style>



</head>
<body>
    <div class="dimensiones imagen"><h1>Soy el número 1</h1></div>
    <div class="dimensiones imagen"><h1>Soy el número 2</h1></div>
    <div class="dimensiones imagen"><h1>Soy el número 3</h1></div>
  


    
</body>
</html>
