<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hugo Nightfall</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: fira mono, monospace;
        }

        .contenedor{
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header{
            display: flex;
            justify-content: space-around;
            padding: 1.4rem;
        }

        nav li, main li{
            display: inline-block;
            margin-right: 0.5rem;
        }
        nav a, main a{
            color: #f8f8ff;
            text-decoration: none;
        }

        main{
            height: 100%;
            display: flex;
            flex-direction: column;
            
            justify-content: center;
            align-items: center;
            background-color: #292a2d;
            color: #f8f8ff;
        }
        main a:hover{
            text-decoration: underline;
        }

        h1{
            font-size: 3.2rem;
            margin-bottom: 2.5rem;
        }

        footer{
            text-align: center;
            padding: 1.2rem;
        }

        .negro{
            background-color: #252627;
            color: #f8f8ff;
            text-decoration: none;
        }
      



    </style>

</head>


<body>
    <div class="contenedor">
        <header class="negro">
            <div class="logo">
                hello@gohugo.io ~ $
            </div>

            <nav>
                <ul>
                    <li><a class="negro" href="">~/about</a></li>
                    <li><a class="negro" href="">~/blog</a></li>
                </ul>
            </nav>

        </header>

        <main>
            <h1>Hugo Nightfall</h1>
            <ul>
                <li><a href="">github</a></li>
                <li><a href="">twitter</a></li>
                <li><a href="">linkedin</a></li>
                <li><a href="">email</a></li>
            </ul>

        </main>

        <footer class="negro">
                © 2026 Hugo Nightfall, Built with <a class="negro" href="">Hugo</a> and <a class="negro" href="">Nightfall</a> theme
        </footer>


    </div>



</body>

</html>
