<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTRODUCCION A GRID EN CSS</title>

    <style>
        .contenedor {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 10px;
        }

        .contenedor div {
            border: 1px solid blue;
            height: 200px;
        }

        /*AREAS*/

        .areas{
            display: grid;
            grid-template-areas: 
            "cabecera  cabecera  cabecera"
            "lateral   cuerpo     cuerpo"
            "pie        pie        pie ";
        }

        .inicio{
            grid-area: cabecera;
            height: 100px;
            background-color: rgba(151, 228, 228, 0.623);
        }
        .col1{
            grid-area: lateral;
            height: 500px;
            background-color: rgba(150, 228, 202, 0.507);
        }
        .col2{
            grid-area: cuerpo;
            height: 500px;
            background-color: azure;
        }
        .final{
            grid-area: pie;
            height: 100px;
            background-color: rgba(245, 245, 220, 0.692);
        }




    </style>


</head>

<body>

    <div class="areas">
        <div class="inicio">Cabecera</div>
        <div class="col1">Lateral</div>
        <div class="col2">Cuerpo</div>
        <div class="final">Pie</div>
    </div>


    <div class="contenedor">
        <div>A</div>
        <div>B</div>
        <div>C</div>
        <div>D</div>
        <div>E</div>
        <div>F</div>
    </div>



</body>

</html>
